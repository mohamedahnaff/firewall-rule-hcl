---
- name: Firewall change implementation
  hosts: linux_firewall
  gather_facts: true
  become: true
  vars_files:
    - ../vars/servicenow.yml
    - ../runtime/servicenow_change_request.yml
  tasks:
    - block:
        - name: Run implement role
          ansible.builtin.include_role:
            name: firewall_change

      rescue:
        - name: Update ServiceNow work notes for implement failure
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_work_note_message: |
              [AUTOMATION][IMPLEMENT][FAILED]
              CR: {{ cr_number }}
              Host: {{ inventory_hostname }}
              Stage: Implement
              Error: {{ ansible_failed_result.msg | default(ansible_failed_result | to_nice_json) }}

        - name: Fail play after updating ServiceNow
          ansible.builtin.fail:
            msg: "Implement failed. ServiceNow work note updated."
