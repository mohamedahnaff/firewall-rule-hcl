---
- name: Firewall change report
  hosts: linux_firewall
  gather_facts: true
  become: true
  vars_files:
    - ../vars/servicenow.yml
    - ../runtime/servicenow_change_request.yml
  tasks:
    - block:
        - name: Run report role
          ansible.builtin.include_role:
            name: firewall_report

      rescue:
        - name: Update ServiceNow work notes for report failure
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_work_note_message: |
              [AUTOMATION][REPORT][FAILED]
              CR: {{ cr_number }}
              Host: {{ inventory_hostname }}
              Stage: Report
              Error: {{ ansible_failed_result.msg | default(ansible_failed_result | to_nice_json) }}

        - name: Fail play after updating ServiceNow
          ansible.builtin.fail:
            msg: "Report failed. ServiceNow work note updated."
